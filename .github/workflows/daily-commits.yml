name: Daily Auto Commits

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
    - cron: '0 16 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write   # ← ЭТО ГЛАВНОЕ ИСПРАВЛЕНИЕ! Даём права на запись

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # ← Сохраняем токен для push

      - name: Make random number of commits
        run: |
          git config --local user.email "tima.privalov2008@gmail.com"
          git config --local user.name "timplif"
          
          NUM_COMMITS=$((RANDOM % 3 + 1))
          echo "📝 Сегодня будет сделано коммитов: $NUM_COMMITS"
          
          for i in $(seq 1 $NUM_COMMITS); do
            MESSAGES=("Работа над логикой" "Исправление мелочи" "Добавил комментарии" "Рефакторинг" "Тесты" "Обновил документацию" "Оптимизация" "Чистка кода" "Добавил фичу" "Исправил баг")
            MSG=${MESSAGES[$((RANDOM % ${#MESSAGES[@]}))]}
            
            echo "$(date '+%Y-%m-%d %H:%M:%S') - $MSG (#$i)" >> daily_log.txt
            
            git add daily_log.txt
            git commit -m "$MSG"
            git push
            
            if [ $i -lt $NUM_COMMITS ]; then
              DELAY=$((RANDOM % 1200 + 300))
              echo "⏳ Следующий коммит через $((DELAY / 60)) минут..."
              sleep $DELAY
            fi
          done
          
          echo "✅ Все коммиты сделаны!"

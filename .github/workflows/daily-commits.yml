name: Daily Russian Memes in README

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-meme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch and Add Russian Meme
        run: |
          git config --local user.email "tima.privalov2008@gmail.com"
          git config --local user.name "timplif"
          
          # Считаем количество мемов для статистики
          if [ -f README.md ]; then
            MEME_COUNT=$(grep -c "### 🗓" README.md || echo "0")
            MEME_COUNT=$((MEME_COUNT + 1))
          else
            MEME_COUNT=1
          fi
          
          # Если README.md ещё нет — создаём шаблон
          if [ ! -f README.md ]; then
            cat > README.md << 'EOF'
            # 😂 Коллекция русских мемов
            
            > Автоматически пополняемая коллекция мемов. Каждый день добавляется по 3 мема! 🇷🇺
            
            ---
            
            ## 📊 Статистика
            
            - 🎲 Всего мемов: **1**
            - 📅 Последний мем: _только что_
            -  Обновляется: 3 раза в день
            
            ---
            
            ## 🎲 Свежие мемы
            
            EOF
          else
            # Обновляем счётчик мемов
            sed -i "s/Всего мемов: \*\*[0-9]*\*\*/Всего мемов: **$MEME_COUNT**/" README.md
            sed -i "s/Последний мем: _.*_/Последний мем: _$(date '+%d.%m.%Y %H:%M')_/" README.md
          fi
          
          # Список русских сабреддитов
          SUBREDDITS=("russianmemes" "memes_ru" "RussianHumor")
          RANDOM_SUB=${SUBREDDITS[$((RANDOM % ${#SUBREDDITS[@]}))]}
          
          # Пробуем получить мем
          MEME_JSON=$(curl -s "https://meme-api.com/gimme/$RANDOM_SUB")
          MEME_URL=$(echo "$MEME_JSON" | jq -r '.url')
          MEME_TITLE=$(echo "$MEME_JSON" | jq -r '.title')
          POST_LINK=$(echo "$MEME_JSON" | jq -r '.postLink')
          
          # Фильтрация по кириллице
          if [ "$MEME_URL" == "null" ] || [ -z "$MEME_URL" ]; then
            echo "Ищем мем с кириллицей..."
            
            for i in {1..10}; do
              MEME_JSON=$(curl -s https://meme-api.com/gimme)
              MEME_TITLE=$(echo "$MEME_JSON" | jq -r '.title')
              
              if echo "$MEME_TITLE" | grep -q '[а-яА-ЯёЁ]'; then
                MEME_URL=$(echo "$MEME_JSON" | jq -r '.url')
                POST_LINK=$(echo "$MEME_JSON" | jq -r '.postLink')
                echo "✅ Нашёл: $MEME_TITLE"
                break
              fi
            done
          fi
          
          # Запасной вариант
          if [ "$MEME_URL" == "null" ] || [ -z "$MEME_URL" ]; then
            MEME_URL="https://i.imgflip.com/1g8my4.jpg"
            MEME_TITLE="Запасной мем"
            POST_LINK="https://imgflip.com"
          fi
          
          # Добавляем мем
          TODAY=$(date '+%d.%m.%Y %H:%M')
          cat >> README.md << EOF
          ### 🗓 $TODAY — $MEME_TITLE
          
          ![]($MEME_URL)
          
          <sub>Источник: [Reddit]($POST_LINK)</sub>
          
          ---
          
          EOF
          
          git add README.md
          git commit -m " Мем #$MEME_COUNT: $MEME_TITLE"
          git push
          
          echo "✅ Мем #$MEME_COUNT добавлен!"

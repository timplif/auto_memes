name: Daily Russian Memes in README

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-meme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Git
        run: |
          git config --local user.email "tima.privalov2008@gmail.com"
          git config --local user.name "timplif"

      - name: Generate and Add Meme (Python)
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import urllib.request
          import json
          import re
          import random
          from datetime import datetime

          README_FILE = "README.md"

          # ПРОВЕРЕННЫЕ рабочие ссылки на мемы (Imgur — надежный хостинг)
          FALLBACK_MEMES = [
              {"url": "https://i.imgur.com/Q3hcK.png", "title": "It works on my machine"},
              {"url": "https://i.imgur.com/2YzJg8l.png", "title": "When the code works"},
              {"url": "https://i.imgur.com/3nM7pQd.png", "title": "Debugging be like"},
              {"url": "https://i.imgur.com/kFSa8bP.png", "title": "Programmer life"},
              {"url": "https://i.imgur.com/JnZ3kLd.png", "title": "Friday 17:00"},
              {"url": "https://i.imgur.com/8QbVz8p.png", "title": "Stack Overflow спасает"},
              {"url": "https://i.imgur.com/yT9qK2L.png", "title": "Дедлайн вчера"},
              {"url": "https://i.imgur.com/5R3zK9m.png", "title": "Когда нашел баг в продакшене"}
          ]

          def get_meme():
              try:
                  # Пробуем получить мем из API
                  req = urllib.request.Request("https://meme-api.com/gimme", headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=5) as response:
                      data = json.loads(response.read().decode())
                      url = data.get('url')
                      title = data.get('title', 'Мем')
                      
                      # Проверяем, что ссылка рабочая
                      if url and 'http' in url:
                          # Проверяем, что это изображение
                          img_req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                          with urllib.request.urlopen(img_req, timeout=3) as img_response:
                              if 'image' in img_response.headers.get('Content-Type', ''):
                                  return url, title
              except Exception as e:
                  print(f"API не сработал: {e}")
                  pass
              
              # Берем случайный проверенный мем
              meme = random.choice(FALLBACK_MEMES)
              return meme['url'], meme['title']

          # Создаем или обновляем README
          if os.path.exists(README_FILE):
              with open(README_FILE, 'r', encoding='utf-8') as f:
                  content = f.read()
              count = len(re.findall(r'### 🗓', content)) + 1
              content = re.sub(r'Всего мемов: \*\*\d+\*\*', f'Всего мемов: **{count}**', content)
              content = re.sub(r'Последний мем: _.*_', f'Последний мем: _{datetime.now().strftime("%d.%m.%Y %H:%M")}_', content)
          else:
              count = 1
              now_str = datetime.now().strftime("%d.%m.%Y %H:%M")
              content = f"# 😂 Коллекция русских мемов\n\n"
              content += f"> Автоматически пополняемая коллекция мемов. Каждый день добавляется по 3 мема! 🇷🇺\n\n"
              content += f"---\n\n"
              content += f"## 📊 Статистика\n\n"
              content += f"- 🎲 Всего мемов: **{count}**\n"
              content += f"-  Последний мем: _{now_str}_\n"
              content += f"- 🔄 Обновляется: 3 раза в день\n\n"
              content += f"---\n\n"
              content += f"## 🎲 Свежие мемы\n\n"

          meme_url, meme_title = get_meme()
          now_str = datetime.now().strftime("%d.%m.%Y %H:%M")

          new_meme_block = f"###  {now_str} — {meme_title}\n\n"
          new_meme_block += f"![]({meme_url})\n\n"
          new_meme_block += f"<sub>Источник: Reddit / Проверенные мемы</sub>\n\n"
          new_meme_block += f"---\n\n"
          
          content += new_meme_block

          with open(README_FILE, 'w', encoding='utf-8') as f:
              f.write(content)

          print(f"✅ Мем #{count} добавлен: {meme_title}")
          print(f"🔗 URL: {meme_url}")
          PYTHON_SCRIPT

      - name: Commit and Push
        run: |
          git add README.md
          git commit -m "😂 Добавил русский мем"
          git push

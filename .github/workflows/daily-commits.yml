name: Daily Russian Memes in README

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-meme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch and Add Russian Meme
        run: |
          git config --local user.email "tima.privalov2008@gmail.com"
          git config --local user.name "timplif"
          
          # Создаем README если нет
          if [ ! -f README.md ]; then
            echo "# 😂 Коллекция русских мемов" > README.md
            echo "" >> README.md
            echo "> Автоматически пополняемая коллекция мемов. Каждый день добавляется по 3 мема! 🇷🇺" >> README.md
            echo "" >> README.md
            echo "---" >> README.md
            echo "" >> README.md
            echo "## 📊 Статистика" >> README.md
            echo "" >> README.md
            echo "- 🎲 Всего мемов: **1**" >> README.md
            echo "-  Обновляется: 3 раза в день" >> README.md
            echo "" >> README.md
            echo "---" >> README.md
            echo "" >> README.md
            echo "## 🎲 Свежие мемы" >> README.md
            echo "" >> README.md
          fi
          
          # Получаем мем
          MEME_JSON=$(curl -s https://meme-api.com/gimme)
          MEME_URL=$(echo "$MEME_JSON" | jq -r '.url')
          MEME_TITLE=$(echo "$MEME_JSON" | jq -r '.title')
          POST_LINK=$(echo "$MEME_JSON" | jq -r '.postLink')
          
          # Если не получилось - берем запасной
          if [ "$MEME_URL" = "null" ] || [ -z "$MEME_URL" ]; then
            MEME_URL="https://i.imgflip.com/1g8my4.jpg"
            MEME_TITLE="Запасной мем"
            POST_LINK="https://imgflip.com"
          fi
          
          # Добавляем мем
          TODAY=$(date '+%d.%m.%Y %H:%M')
          echo "### 🗓 $TODAY — $MEME_TITLE" >> README.md
          echo "" >> README.md
          echo "![]($MEME_URL)" >> README.md
          echo "" >> README.md
          echo "<sub>Источник: [Reddit]($POST_LINK)</sub>" >> README.md
          echo "" >> README.md
          echo "---" >> README.md
          echo "" >> README.md
          
          git add README.md
          git commit -m "😂 Добавил мем: $MEME_TITLE"
          git push
          
          echo "✅ Мем добавлен!"

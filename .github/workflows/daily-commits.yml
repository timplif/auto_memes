name: Daily Russian Memes in README

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-meme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Git
        run: |
          git config --local user.email "tima.privalov2008@gmail.com"
          git config --local user.name "timplif"

      - name: Generate and Add Russian Meme
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import urllib.request
          import json
          import re
          import random
          from datetime import datetime

          README_FILE = "README.md"

          # Локальный банк русских мемов
          RUSSIAN_MEMES = [
              {"url": "https://i.imgflip.com/1g8my4.jpg", "title": "Две кнопки: Работает и Не работает"},
              {"url": "https://i.imgflip.com/30b1gx.jpg", "title": "Дрейк: Писать баги / Писать мемы"},
              {"url": "https://i.imgflip.com/261o3j.jpg", "title": "Это баг? Нет, это фича!"},
              {"url": "https://i.imgflip.com/46e43q.jpg", "title": "Всегда так было (про легаси код)"},
              {"url": "https://i.imgflip.com/3lmzyx.jpg", "title": "Stonks (когда код скомпилировался)"},
              {"url": "https://i.imgflip.com/1ur9b0.jpg", "title": "Отвлеченный программист"},
              {"url": "https://i.imgflip.com/24y43o.jpg", "title": "Change My Mind: Python лучше всех"},
          ]

          def get_russian_meme():
              subreddits = ["russianmemes", "memes_ru", "RussianHumor"]
              
              for sub in subreddits:
                  try:
                      req = urllib.request.Request(
                          f"https://meme-api.com/gimme/{sub}",
                          headers={'User-Agent': 'Mozilla/5.0'}
                      )
                      with urllib.request.urlopen(req, timeout=5) as response:
                          data = json.loads(response.read().decode())
                          url = data.get('url')
                          title = data.get('title', 'Русский мем')
                          
                          if url and 'http' in url and title:
                              if re.search('[а-яА-ЯёЁ]', title):
                                  print(f"✅ Нашел мем из r/{sub}: {title}")
                                  return url, title
                  except Exception as e:
                      print(f"❌ {sub} не сработал: {e}")
                      continue
              
              print("⚠️ API не вернул русский мем, берем из локального банка")
              meme = random.choice(RUSSIAN_MEMES)
              return meme['url'], meme['title']

          now_str = datetime.now().strftime("%d.%m.%Y %H:%M")

          if os.path.exists(README_FILE):
              with open(README_FILE, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Считаем мемы
              count = len(re.findall(r'### 🗓', content)) + 1
              
              # Разделяем README на шапку и мемы
              # Находим раздел "## 🎲 Свежие мемы"
              header_end = content.find("##  Свежие мемы")
              
              if header_end != -1:
                  # Находим конец заголовка раздела (после пустой строки)
                  memes_start = content.find("\n\n", header_end) + 2
                  header = content[:memes_start]
                  old_memes = content[memes_start:]
              else:
                  header = content + "\n## 🎲 Свежие мемы\n\n"
                  old_memes = ""
              
              # Обновляем статистику в шапке
              header = re.sub(
                  r'Всего мемов: \*\*\d+\*\*',
                  f'Всего мемов: **{count}**',
                  header
              )
              header = re.sub(
                  r'Последний мем: _.*_',
                  f'Последний мем: _{now_str}_',
                  header
              )
          else:
              count = 1
              header = f"""# 😂 Коллекция русских мемов

> Автоматически пополняемая коллекция мемов. Каждый день добавляется по 3 мема! 🇷🇺

---

## 📊 Статистика

- 🎲 Всего мемов: **{count}**
- 📅 Последний мем: _{now_str}_
- 🔄 Обновляется: 3 раза в день

---

## 🎲 Свежие мемы

"""
              old_memes = ""

          # Получаем мем
          meme_url, meme_title = get_russian_meme()

          # Формируем блок нового мема
          new_meme_block = f"""### 🗓 {now_str} — {meme_title}

![]({meme_url})

<sub>Источник: Reddit / Локальный банк мемов</sub>

---

"""
          
          # Собираем: шапка + НОВЫЙ мем + старые мемы
          content = header + new_meme_block + old_memes

          with open(README_FILE, 'w', encoding='utf-8') as f:
              f.write(content)

          print(f"✅ Мем #{count} добавлен в начало: {meme_title}")
          PYTHON_SCRIPT

      - name: Commit and Push
        run: |
          git add README.md
          git commit -m "😂 Добавил русский мем"
          git push
